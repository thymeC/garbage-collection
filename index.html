<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>垃圾回收站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --neon-pink: #ff2a6d;
      --neon-cyan: #05d9e8;
      --neon-purple: #d300c5;
      --neon-yellow: #f9f002;
      --bg-dark: #0a0a12;
      --bg-panel: rgba(12, 12, 28, 0.85);
      --grid: rgba(5, 217, 232, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: "Noto Sans SC", sans-serif;
      background: var(--bg-dark);
      color: #e0e0ff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.12) 2px,
        rgba(0, 0, 0, 0.12) 4px
      );
      z-index: 1000;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      perspective: 500px;
      transform: perspective(500px) rotateX(60deg) scale(2.5) translateY(-20%);
      opacity: 0.6;
      z-index: 0;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .glow-orb.pink { width: 300px; height: 300px; background: var(--neon-pink); top: 10%; left: 5%; }
    .glow-orb.cyan { width: 250px; height: 250px; background: var(--neon-cyan); bottom: 20%; right: 10%; animation-delay: -3s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -30px); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 0.85rem 1rem 0.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    header {
      text-align: center;
      margin-bottom: 0.65rem;
      flex-shrink: 0;
    }

    .logo {
      font-family: Orbitron, sans-serif;
      font-size: clamp(1.15rem, 3.5vw, 1.55rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 42, 109, 0.5);
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.85; }
      97% { opacity: 1; }
      98% { opacity: 0.9; }
    }

    .tagline {
      margin-top: 0.2rem;
      font-size: 0.75rem;
      color: rgba(224, 224, 255, 0.65);
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid rgba(5, 217, 232, 0.35);
      border-radius: 4px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 0;
      box-shadow:
        0 0 20px rgba(5, 217, 232, 0.15),
        inset 0 0 40px rgba(5, 217, 232, 0.03);
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent);
    }

    .panel-input {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .panel-bay {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: min(42vh, 280px);
    }

    .bay-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 0.55rem;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 640px) {
      .bay-grid { grid-template-columns: 1fr; }
    }

    .bay-cell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      padding: 0.5rem 0.55rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(5, 217, 232, 0.2);
      border-radius: 2px;
    }

    .sub-label {
      font-family: Orbitron, sans-serif;
      font-size: 0.58rem;
      color: rgba(5, 217, 232, 0.85);
      letter-spacing: 0.15em;
      margin-bottom: 0.4rem;
      flex-shrink: 0;
    }

    .panel-label {
      font-family: Orbitron, sans-serif;
      font-size: 0.65rem;
      color: var(--neon-cyan);
      letter-spacing: 0.2em;
      margin-bottom: 0.45rem;
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      min-height: 3.25rem;
      max-height: 5rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 42, 109, 0.4);
      border-radius: 2px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.55rem 0.65rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(5, 217, 232, 0.3);
    }

    textarea::placeholder { color: rgba(255, 255, 255, 0.3); }

    .char-count {
      text-align: right;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 0.35rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.65rem;
      align-items: center;
      margin-top: 0.5rem;
      flex-shrink: 0;
    }

    .toggle-row { font-size: 0.78rem; }

    .btn {
      font-family: Orbitron, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.5rem 1rem;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #fff;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      box-shadow: 0 0 20px rgba(255, 42, 109, 0.5);
    }

    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(255, 42, 109, 0.8);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    }

    .btn-secondary:hover {
      background: rgba(5, 217, 232, 0.1);
      box-shadow: 0 0 15px rgba(5, 217, 232, 0.4);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: rgba(224, 224, 255, 0.8);
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(5, 217, 232, 0.5);
      border-radius: 2px;
      cursor: pointer;
      transition: 0.2s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--neon-cyan);
      transition: 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: rgba(255, 42, 109, 0.2);
      border-color: var(--neon-pink);
    }

    .toggle input:checked + .toggle-slider::before {
      left: calc(100% - 19px);
      background: var(--neon-pink);
    }

    .bay-degrade {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .degrade-standard {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .recycler {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem;
      width: 100%;
    }

    .recycler-icon {
      width: 68px;
      height: 68px;
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      animation: spin-slow 12s linear infinite;
      box-shadow: 0 0 24px rgba(5, 217, 232, 0.45);
    }

    .recycler.active .recycler-icon {
      animation: spin-fast 0.8s linear infinite;
      border-color: var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.6);
    }

    @keyframes spin-slow { to { transform: rotate(360deg); } }
    @keyframes spin-fast { to { transform: rotate(360deg); } }

    .recycler-status {
      font-family: Orbitron, sans-serif;
      font-size: clamp(0.82rem, 2.4vw, 1rem);
      font-weight: 600;
      color: var(--neon-cyan);
      letter-spacing: 0.12em;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(5, 217, 232, 0.35);
    }

    .output-line {
      flex-shrink: 0;
      margin-top: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 1.6rem;
    }

    .output-line-label {
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.35);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .output-text {
      flex: 1;
      min-width: 0;
      padding: 0.2rem 0.45rem;
      background: rgba(0, 0, 0, 0.5);
      border-left: 2px solid var(--neon-yellow);
      font-size: 0.78rem;
      line-height: 1.5;
      height: 1.5em;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      color: rgba(255, 255, 255, 0.35);
      scrollbar-width: none;
    }

    .output-text::-webkit-scrollbar {
      display: none;
    }

    .output-text.visible {
      color: #e0e0ff;
    }

    .output-text::before {
      content: "等待复述…";
      font-size: 0.72rem;
    }

    .output-text.visible:has(#outputTrack:not(:empty))::before {
      content: none;
    }

    #outputTrack {
      display: inline;
    }

    .output-played {
      opacity: 0.4;
    }

    .output-active {
      color: #fff;
      text-shadow: 0 0 6px rgba(5, 217, 232, 0.5);
    }

    .output-done {
      color: var(--neon-cyan);
      font-size: 0.72rem;
    }

    .output-text .censor {
      color: var(--neon-yellow);
      font-weight: 700;
      text-shadow: 0 0 8px var(--neon-yellow);
    }

    .bay-cert {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0.35rem;
      border-color: rgba(211, 0, 197, 0.35);
    }

    .certificate {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      min-height: 100%;
      padding: 0.85rem 0.55rem;
      background: linear-gradient(145deg, rgba(20, 10, 40, 0.95), rgba(10, 20, 50, 0.95));
      border: 1px solid rgba(211, 0, 197, 0.35);
      border-radius: 2px;
      position: relative;
      text-align: center;
    }

    .cert-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .certificate.visible {
      animation: cert-in 0.6s ease-out;
    }

    .bay-cert.certificate-ready .certificate {
      border-color: var(--neon-purple);
      box-shadow: inset 0 0 28px rgba(211, 0, 197, 0.15);
    }

    .cert-empty {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.5;
      padding: 0.5rem 0;
    }

    .certificate.visible .cert-empty { display: none; }

    .cert-real {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
    }

    .certificate.visible .cert-real {
      display: flex;
    }

    @keyframes cert-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .certificate.visible::after {
      content: "✓ 已认证";
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      font-family: Orbitron, sans-serif;
      font-size: 0.55rem;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 0.15rem 0.35rem;
      transform: rotate(12deg);
    }

    .cert-title {
      font-family: Orbitron, sans-serif;
      font-size: clamp(1rem, 3.2vw, 1.2rem);
      font-weight: 700;
      color: var(--neon-pink);
      letter-spacing: 0.15em;
      margin: 0;
      flex-shrink: 0;
      line-height: 1.3;
      text-shadow: 0 0 14px rgba(255, 42, 109, 0.5);
    }

    .cert-body {
      font-size: 0.74rem;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.92);
      max-width: 16em;
      margin: 0;
    }

    .cert-pollution {
      margin: 0;
      font-family: Orbitron, sans-serif;
      font-size: clamp(0.88rem, 2.6vw, 1.05rem);
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(5, 217, 232, 0.4);
      letter-spacing: 0.06em;
    }

    .cert-id {
      margin: 0;
      padding-top: 0.25rem;
      font-size: 0.52rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.38);
      font-family: monospace;
      max-width: 100%;
      word-break: break-word;
    }

    .rose-mode {
      display: none;
      margin-top: 0.4rem;
      padding: 0.45rem 0.55rem;
      background: linear-gradient(135deg, rgba(80, 20, 60, 0.4), rgba(40, 10, 50, 0.5));
      border: 1px solid rgba(255, 100, 150, 0.5);
      text-align: center;
      flex-shrink: 0;
      max-height: 4rem;
      overflow-y: auto;
    }

    .rose-mode.visible { display: block; animation: cert-in 0.5s ease-out; }

    .rose-emoji { font-size: 1.25rem; margin-bottom: 0.2rem; animation: rose-pulse 2s ease-in-out infinite; }

    @keyframes rose-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .rose-text {
      font-size: 0.72rem;
      font-style: italic;
      color: #ffb3d9;
      line-height: 1.4;
    }

    .wall-panel {
      flex-shrink: 0;
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      max-height: min(22vh, 140px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .wall-panel .panel-label { margin-bottom: 0.35rem; }

    #wallList {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .wall-item {
      padding: 0.45rem 0.65rem;
      margin-bottom: 0.35rem;
      background: rgba(0, 0, 0, 0.35);
      border-left: 2px solid var(--neon-purple);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .wall-meta {
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 0.35rem;
    }

    .wall-empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.75rem;
      padding: 0.35rem;
    }

    footer {
      text-align: center;
      margin-top: 0.35rem;
      padding-bottom: 0.35rem;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-orb pink"></div>
  <div class="glow-orb cyan"></div>
  <div class="scanlines"></div>

  <main class="container">
    <header>
      <h1 class="logo">垃圾回收站</h1>
      <p class="tagline">给想骂人但不能骂的人 · 合法情绪降解终端 v2.077</p>
    </header>

    <div class="workspace">
      <section class="panel panel-input">
        <div class="panel-label">// 输入待回收物质</div>
        <textarea
          id="input"
          maxlength="500"
          rows="2"
          placeholder="把想对奇葩同事/客服/前任说的话倒进来……"
        ></textarea>
        <div class="char-count"><span id="charCount">0</span> / 500</div>
        <div class="controls">
          <button type="button" class="btn btn-primary" id="recycleBtn">♻ 回收</button>
          <label class="toggle-row">
            <span class="toggle">
              <input type="checkbox" id="publicToggle" />
              <span class="toggle-slider"></span>
            </span>
            随机匿名公开
          </label>
          <label class="toggle-row">
            <span class="toggle">
              <input type="checkbox" id="roseToggle" />
              <span class="toggle-slider"></span>
            </span>
            和解模式 🌹
          </label>
        </div>
      </section>

      <section class="panel panel-bay">
        <div class="panel-label">// 回收仓</div>
        <div class="bay-grid">
          <div class="bay-cell bay-degrade">
            <div class="sub-label">降解舱 · 回收标准</div>
            <div class="degrade-standard">
              <div class="recycler" id="recycler">
                <div class="recycler-icon">♻</div>
                <div class="recycler-status" id="statusText">待机中 · STANDBY</div>
              </div>
            </div>
            <div class="output-line">
              <span class="output-line-label">无害化</span>
              <div class="output-text" id="output"><span id="outputTrack"></span></div>
            </div>
            <div class="rose-mode" id="roseMode">
              <span class="rose-emoji">🌹</span>
              <p class="rose-text" id="roseText"></p>
            </div>
          </div>
          <div class="bay-cell bay-cert" id="certBay">
            <div class="certificate" id="certificate">
              <div class="cert-inner">
                <div class="cert-title">情绪净化证明 🍃</div>
                <p class="cert-empty">完成回收后颁发证明</p>
                <div class="cert-real">
                  <p class="cert-body" id="certBody"></p>
                  <div class="cert-pollution" id="certPollution"></div>
                  <div class="cert-id" id="certId"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <section class="panel wall-panel">
      <div class="panel-label">// 匿名共情墙 · 已无害化</div>
      <div id="wallList">
        <p class="wall-empty">还没有人公开垃圾话，你来当第一个？</p>
      </div>
    </section>

    <footer>本回收站不存储原始脏话 · 仅本地演示 · 污染指数纯属娱乐</footer>
  </main>

  <script>

      "每一句未出口的锋芒，都是心里藏着的一束未送出的花。",
      "愤怒是暂时的乌云，理解是永恒的晴空与玫瑰园。",
      "把刺留给过去，把花瓣留给明天。",
      "世界很大，不值得用脏话丈量；不如用一朵玫瑰丈量温柔。",
      "您的心声已转码为：{rose}——请查收这份和解。",
    ];

    const ROSE_WORDS = {
      "烦": "心中偶有微风拂过",
      "讨厌": "尚未结缘的缘分",
      "恨": "深刻的记忆",
      "滚": "请走向您的人生下一站",
      "死": "长眠于往事",
      "傻": "天真烂漫",
      "笨": "质朴可爱",
      "烂": "有待雕琢",
      "垃圾": "可回收资源",
      "废物": "潜力股",
      "白痴": "纯粹的灵魂",
      "操": "操作",
      "草": "青草",
      "靠": "依靠",
      "妈": "母亲",
      "狗": "忠诚的朋友",
      "猪": "福气的象征",
    };

    const STORAGE_KEY = "garbage-recycle-wall";

    const input = document.getElementById("input");
    const charCount = document.getElementById("charCount");
    const recycleBtn = document.getElementById("recycleBtn");
    const publicToggle = document.getElementById("publicToggle");
    const roseToggle = document.getElementById("roseToggle");
    const recycler = document.getElementById("recycler");
    const statusText = document.getElementById("statusText");
    const output = document.getElementById("output");
    const outputTrack = document.getElementById("outputTrack");
    const roseMode = document.getElementById("roseMode");
    const roseText = document.getElementById("roseText");
    const certificate = document.getElementById("certificate");
    const certBay = document.getElementById("certBay");
    const certBody = document.getElementById("certBody");
    const certPollution = document.getElementById("certPollution");
    const certId = document.getElementById("certId");
    const wallList = document.getElementById("wallList");

    let audioCtx = null;
    let isProcessing = false;

    input.addEventListener("input", () => {
      charCount.textContent = input.value.length;
    });

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playBeep(duration = 0.12) {
      const ctx = getAudioCtx();
      const t0 = ctx.currentTime;
      const d = Math.min(Math.max(duration, 0.09), 0.17);

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1150, t0);
      osc.frequency.exponentialRampToValueAtTime(820, t0 + d * 0.9);

      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.4, t0 + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + d);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + d + 0.015);

      const click = ctx.createBufferSource();
      const len = Math.floor(ctx.sampleRate * 0.012);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      click.buffer = buf;
      const clickGain = ctx.createGain();
      clickGain.gain.setValueAtTime(0.08, t0);
      clickGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.012);
      click.connect(clickGain);
      clickGain.connect(ctx.destination);
      click.start(t0);
    }

    function playMechanicalHum() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 120;
      osc.type = "sawtooth";
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    }

    function escapeRegex(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function buildProfanityRegex() {
      const parts = PROFANITY.map((w) => escapeRegex(w));
      return new RegExp(parts.join("|"), "gi");
    }

    const profanityRegex = buildProfanityRegex();

    function randomCensorVisual() {
      return CENSOR_VISUALS[Math.floor(Math.random() * CENSOR_VISUALS.length)];
    }

    function sanitize(text) {
      const segments = [];
      let lastIndex = 0;
      const regex = new RegExp(profanityRegex.source, "gi");
      let match;

      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          segments.push({ type: "text", value: text.slice(lastIndex, match.index) });
        }
        const word = match[0];
        for (const char of word) {
          const visual = randomCensorVisual();
          segments.push({ type: "censor", display: visual.display, original: char });
        }
        lastIndex = regex.lastIndex;
      }

      if (lastIndex < text.length) {
        segments.push({ type: "text", value: text.slice(lastIndex) });
      }

      const sanitized = segments
        .map((s) => (s.type === "censor" ? s.display : s.value))
        .join("");

      return { segments, sanitized };
    }

    function segmentToHtml(seg) {
      if (seg.type === "censor") {
        return `<span class="censor">${escapeHtml(seg.display)}</span>`;
      }
      return escapeHtml(seg.value);
    }

    function updateOutputLine(segments, activeIndex) {
      const parts = [];
      for (let i = 0; i < segments.length; i++) {
        const html = segmentToHtml(segments[i]);
        if (i < activeIndex) {
          parts.push(`<span class="output-played">${html}</span>`);
        } else if (i === activeIndex) {
          parts.push(`<span class="output-active">${html}</span>`);
        }
      }
      outputTrack.innerHTML = parts.join("");
      output.classList.add("visible");
      requestAnimationFrame(() => {
        output.scrollLeft = output.scrollWidth;
      });
    }

    function finishOutputLine() {
      outputTrack.innerHTML = '<span class="output-done">已无害化 ✓</span>';
      output.scrollLeft = 0;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function speakSegment(text) {
      return new Promise((resolve) => {
        if (!text.trim()) {
          resolve();
          return;
        }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = 0.85;
        u.pitch = 0.6;
        u.volume = 1;
        const voices = speechSynthesis.getVoices();
        const zh = voices.find((v) => v.lang.startsWith("zh"));
        if (zh) u.voice = zh;
        u.onend = resolve;
        u.onerror = resolve;
        speechSynthesis.speak(u);
      });
    }

    function delay(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function playSanitizedAudio(segments) {
      speechSynthesis.cancel();
      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        updateOutputLine(segments, i);
        if (seg.type === "text" && seg.value.trim()) {
          await speakSegment(seg.value);
        } else if (seg.type === "censor") {
          const beepLen = 0.11;
          playBeep(beepLen);
          await delay(beepLen * 1000 + 35);
        }
      }
      finishOutputLine();
    }

    function toRosePoetry(text) {
      let poetic = text;
      for (const [key, val] of Object.entries(ROSE_WORDS)) {
        poetic = poetic.split(key).join(val);
      }
      const template = ROSE_TEMPLATES[Math.floor(Math.random() * ROSE_TEMPLATES.length)];
      const roseLine = poetic.length > 80 ? poetic.slice(0, 80) + "……" : poetic;
      return template.replace("{rose}", roseLine || "一朵静默绽放的玫瑰");
    }

    function generateCertId() {
      const t = Date.now().toString(36).toUpperCase();
      const r = Math.random().toString(36).slice(2, 6).toUpperCase();
      return `GARBAGE-RECYCLE-${t}-${r}`;
    }

    function showCertificate(sanitized, censorCount) {
      const reduction = Math.min(19 + censorCount * 3, 97);
      certBody.textContent =
        "您的负能量已安全降解，污染指数降低 " +
        reduction +
        "%。经光谱分析，当前情绪洁净度达标，可重返文明社会。";
      certPollution.textContent = `▼ 污染指数 -${reduction}% ▼`;
      certId.textContent = `证书编号：${generateCertId()} · ${new Date().toLocaleString("zh-CN")}`;
      certificate.classList.add("visible");
      certBay.classList.add("certificate-ready");
    }

    function loadWall() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const items = raw ? JSON.parse(raw) : [];
        renderWall(items);
      } catch {
        renderWall([]);
      }
    }

    function renderWall(items) {
      if (!items.length) {
        wallList.innerHTML = '<p class="wall-empty">还没有人公开垃圾话，你来当第一个？</p>';
        return;
      }
      wallList.innerHTML = items
        .slice(0, 20)
        .map(
          (item) => `
        <div class="wall-item">
          ${escapeHtml(item.text)}
          <div class="wall-meta">${escapeHtml(item.time)} · 匿名旅人 #${item.id}</div>
        </div>`
        )
        .join("");
    }

    function publishToWall(sanitized) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const items = raw ? JSON.parse(raw) : [];
        items.unshift({
          text: sanitized,
          time: new Date().toLocaleString("zh-CN"),
          id: Math.floor(Math.random() * 9000 + 1000),
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(0, 50)));
        renderWall(items.slice(0, 20));
      } catch (e) {
        console.warn("wall save failed", e);
      }
    }

    recycleBtn.addEventListener("click", async () => {
      const text = input.value.trim();
      if (!text || isProcessing) return;

      if (audioCtx?.state === "suspended") await audioCtx.resume();

      isProcessing = true;
      recycleBtn.disabled = true;
      recycler.classList.add("active");
      certificate.classList.remove("visible");
      certBay.classList.remove("certificate-ready");
      roseMode.classList.remove("visible");
      outputTrack.innerHTML = "";
      output.classList.remove("visible");

      const statuses = [
        "扫描毒性物质…",
        "启动哔——滤波器…",
        "注入🌼中和剂…",
        "机械复述中…",
        "降解完成 · DEGRADED",
      ];
      let si = 0;
      const statusInterval = setInterval(() => {
        statusText.textContent = statuses[si % statuses.length];
        si++;
        playMechanicalHum();
      }, 600);

      const { segments, sanitized } = sanitize(text);
      const censorCount = segments.filter((s) => s.type === "censor").length;

      await delay(400);
      statusText.textContent = "机械复述中 · VOCALIZING…";

      await playSanitizedAudio(segments);

      clearInterval(statusInterval);
      recycler.classList.remove("active");
      statusText.textContent = "降解完成 · DEGRADED";

      showCertificate(sanitized, censorCount);

      if (roseToggle.checked) {
        roseText.textContent = toRosePoetry(text);
        roseMode.classList.add("visible");
      }

      if (publicToggle.checked) {
        publishToWall(sanitized);
      }

      isProcessing = false;
      recycleBtn.disabled = false;
    });

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    loadWall();
  </script>
</body>
</html>
